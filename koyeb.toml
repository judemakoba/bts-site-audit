# Koyeb deployment config
# Docs: https://koyeb.com/docs

name = "bts-site-audit"
runtime.inputs = []

[services]
  name = "api"
  runtime.port = 3000
  runtime.health_check = { path = "/api/health" }

  build.command = """
    cd backend && npm install --ignore-scripts
  """

  run.command = "cd backend && node server.js"

  [[services.routes]]
    path = "/*"
    port = 3000

  [services.resources]
    memory = "256MiB"
    cpu = "0.25"

# ── Environment Variables ──────────────────────────────────────────────────────
[vars]
  NODE_ENV = "production"
  PORT = "3000"
